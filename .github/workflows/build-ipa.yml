name: Build HTML app as IPA

on:
  workflow_dispatch:

env:
  APP_ID: com.dhruvverma.htmlapp
  APP_NAME: Times

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Capacitor & Native Plugins
        run: |
          set -euxo pipefail
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios \
            @capacitor/haptics \
            @capacitor/status-bar \
            @capacitor/share \
            @capacitor/filesystem \
            @capacitor/dialog \
            @capacitor/keyboard

      - name: Prepare web files
        run: |
          set -euxo pipefail
          mkdir -p www
          cp -R app/* www/
          ls -la www

      - name: Create Capacitor iOS project
        run: |
          set -euxo pipefail
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.dhruvverma.htmlapp",
            "appName": "Times",
            "webDir": "www",
            "bundledWebRuntime": false,
            "plugins": {
              "StatusBar": {
                "style": "DARK",
                "backgroundColor": "#090707",
                "overlaysWebView": false
              },
              "Keyboard": {
                "resize": "body",
                "style": "DARK"
              }
            },
            "ios": {
              "backgroundColor": "#090707",
              "scrollEnabled": true
            }
          }
          EOF
          npx cap add ios
          npx cap sync ios
          ls -la ios/App

      - name: Generate iOS app icon
        run: |
          set -euxo pipefail
          npx @capacitor/assets generate --ios \
            --iconBackgroundColor '#ffffff' \
            --splashBackgroundColor '#ffffff'

      - name: Build unsigned IPA
        run: |
          set -euxo pipefail
          cd ios/App
          xcodebuild -list -project App.xcodeproj

          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath ../../build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

          mkdir -p ../../build/ipa/Payload
          cp -R "../../build/App.xcarchive/Products/Applications/App.app" \
            ../../build/ipa/Payload/

          cd ../../build/ipa
          zip -qry ../HTMLApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: html-app-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
